
http {

    client_max_body_size 10M;

    error_page 413 = @413;

    location @413 {
        internal;
        default_type application/json;
        return 413 '{"errors":{"photo":"File size must be 3024 KB or less"}}';
    }

    server {
    listen 80;
    server_name chahin.albedo.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name chahin.albedo.dev;

    ssl_certificate /etc/letsencrypt/live/chahin.albedo.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chahin.albedo.dev/privkey.pem;

    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}